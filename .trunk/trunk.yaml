# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  disabled:
    - oxlint
  enabled:
    - checkov@3.3.20
    - eslint@10.11.0
    - git-diff-check
    - grype@0.119.0
    - hadolint@2.15.1
    - markdownlint@0.49.1
    - osv-scanner@2.6.0
    - oxipng@10.2.1
    - prettier@3.9.9
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trufflehog@3.97.9
    - yamllint@1.38.0
  ignore:
    - linters: [ALL]
      paths:
        - .claude/**
    # Vendored design-system kit: the .jsx components and their .prompt.md docs ship as-is
    # (see apps/web/src/design-system/README.md). ESLint has no .jsx config here and the kit's
    # docs start on a table of contents, not a heading. The local .tsx and the kit README stay
    # linted.
    - linters: [eslint]
      paths:
        - apps/web/src/design-system/**/*.jsx
    - linters: [markdownlint]
      paths:
        - apps/web/src/design-system/**/*.prompt.md
tools:
  disabled:
    - oxfmt
  enabled:
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
