packages:
  - apps/*
  - packages/*
  - tools/*
overrides:
  # deepmerge-ts arrive par prisma -> @prisma/config. GHSA-ggr8-5vv4-36mx n'est corrigé que
  # dans la 8.x, hors de la plage ^7 déclarée par @prisma/config : override assumé.
  deepmerge-ts: ^8.0.2
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
