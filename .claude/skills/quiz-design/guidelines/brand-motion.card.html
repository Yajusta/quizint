<!-- @dsCard group="Brand" viewport="700x170" name="Motion" subtitle="120 / 200 / 320 / 600 ms on ease-out; spring only for score reveals" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(12,14,16,.08)}.mono{font:var(--text-code);color:var(--text-muted)}.lbl{font:var(--text-label)}</style></head>
<body><div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:14px"><span class="mono" style="width:110px">--dur-fast</span><span style="font:var(--text-numeric);font-size:14px;width:70px">120 ms</span><span style="font:var(--text-body-sm);color:var(--text-secondary)">survol, focus</span></div><div style="display:flex;align-items:center;gap:14px"><span class="mono" style="width:110px">--dur-base</span><span style="font:var(--text-numeric);font-size:14px;width:70px">200 ms</span><span style="font:var(--text-body-sm);color:var(--text-secondary)">bascules, entrées de panneau</span></div><div style="display:flex;align-items:center;gap:14px"><span class="mono" style="width:110px">--dur-slow</span><span style="font:var(--text-numeric);font-size:14px;width:70px">320 ms</span><span style="font:var(--text-body-sm);color:var(--text-secondary)">barres de distribution</span></div><div style="display:flex;align-items:center;gap:14px"><span class="mono" style="width:110px">--dur-stage</span><span style="font:var(--text-numeric);font-size:14px;width:70px">600 ms</span><span style="font:var(--text-body-sm);color:var(--text-secondary)">transitions du stage projeté</span></div>
<div class="mono">--ease-out cubic-bezier(.2,.8,.2,1) par défaut · --ease-spring pour les révélations de score</div></div></body></html>
