<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Correct, attention, erreur, information — solid + soft pairs" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(12,14,16,.08)}.mono{font:var(--text-code);color:var(--text-muted)}.lbl{font:var(--text-label)}</style></head>
<body><div class="g" style="gap:18px">
<div class="sw" style="width:145px">
<div style="display:flex;height:56px;border-radius:var(--radius-md);overflow:hidden;border:1px solid rgba(12,14,16,.08)"><span style="flex:1;background:var(--state-success)"></span><span style="flex:1;background:var(--state-success-soft)"></span></div>
<span class="lbl">Correct</span><span class="mono">--state-success</span></div><div class="sw" style="width:145px">
<div style="display:flex;height:56px;border-radius:var(--radius-md);overflow:hidden;border:1px solid rgba(12,14,16,.08)"><span style="flex:1;background:var(--state-warning)"></span><span style="flex:1;background:var(--state-warning-soft)"></span></div>
<span class="lbl">Attention</span><span class="mono">--state-warning</span></div><div class="sw" style="width:145px">
<div style="display:flex;height:56px;border-radius:var(--radius-md);overflow:hidden;border:1px solid rgba(12,14,16,.08)"><span style="flex:1;background:var(--state-danger)"></span><span style="flex:1;background:var(--state-danger-soft)"></span></div>
<span class="lbl">Erreur</span><span class="mono">--state-danger</span></div><div class="sw" style="width:145px">
<div style="display:flex;height:56px;border-radius:var(--radius-md);overflow:hidden;border:1px solid rgba(12,14,16,.08)"><span style="flex:1;background:var(--state-info)"></span><span style="flex:1;background:var(--state-info-soft)"></span></div>
<span class="lbl">Information</span><span class="mono">--state-info</span></div>
</div></body></html>
