<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(12,14,16,.08)}.mono{font:var(--text-code);color:var(--text-muted)}.lbl{font:var(--text-label)}</style></head>
<body><div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:var(--space-7);max-width:420px">
<div style="display:flex;flex-direction:column;gap:var(--space-5)">
<div style="display:flex;flex-direction:column;gap:var(--space-3)"><span style="font:var(--text-h3)">Culture générale</span><span style="font:var(--text-body-sm);color:var(--text-secondary)">12 questions · 20 s</span></div>
<div style="height:1px;background:var(--border-subtle)"></div>
<div style="display:flex;gap:var(--space-3)"><span style="height:32px;padding:0 12px;border-radius:var(--radius-sm);background:var(--surface-brand);color:#fff;display:flex;align-items:center;font:var(--text-label)">Lancer</span><span style="height:32px;padding:0 12px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:#fff;display:flex;align-items:center;font:var(--text-label)">Modifier</span></div>
</div></div></body></html>
