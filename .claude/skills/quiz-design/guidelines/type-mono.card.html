<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(12,14,16,.08)}.mono{font:var(--text-code);color:var(--text-muted)}.lbl{font:var(--text-label)}</style></head>
<body><div style="display:flex;align-items:flex-end;gap:36px">
<div class="sw"><span style="font:var(--text-numeric-xl);letter-spacing:var(--tracking-code)">482 913</span><span class="mono">--text-numeric-xl + --tracking-code</span></div>
<div class="sw"><span style="font:var(--text-numeric);font-size:32px">8 420</span><span class="mono">--text-numeric</span></div>
<div class="sw"><span style="font:var(--text-code)">--dur-base</span><span class="mono">--text-code</span></div></div></body></html>
