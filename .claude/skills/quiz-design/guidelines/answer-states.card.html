<!-- @dsCard group="Colors" viewport="700x240" name="Answer states" subtitle="Propositions are neutral; colour only means selection or correctness" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font:var(--text-body)}.o{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--radius-lg);box-shadow:var(--shadow-1)}.t{width:32px;height:32px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font:var(--text-numeric);font-size:15px}.mono{font:var(--text-code);color:var(--text-muted)}.col{display:flex;flex-direction:column;gap:10px}.hd{font:var(--text-overline);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-muted)}</style></head>
<body><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
<div class="col"><span class="hd">Phase question</span>
<div class="o" style="background:var(--answer-rest-bg);border:1px solid var(--answer-rest-border)"><span class="t" style="background:var(--answer-rest-tile);color:var(--answer-rest-tile-ink)">A</span><span style="flex:1">Proposition</span><span class="mono">default</span></div>
<div class="o" style="background:var(--answer-selected-bg);border:2px solid var(--answer-selected-border)"><span class="t" style="background:var(--brand-700);color:#fff">B</span><span style="flex:1">Sélection</span><span class="mono">selected</span></div>
</div>
<div class="col"><span class="hd">Phase réponse</span>
<div class="o" style="background:var(--answer-correct-bg);border:2px solid var(--answer-correct-border)"><span class="t" style="background:var(--green-600);color:#fff">B</span><span style="flex:1">Bonne réponse</span><span class="mono">correct</span></div>
<div class="o" style="background:var(--answer-wrong-bg);border:2px solid var(--answer-wrong-border)"><span class="t" style="background:var(--red-600);color:#fff">C</span><span style="flex:1">Mauvaise réponse</span><span class="mono">wrong</span></div>
<div class="o" style="background:var(--gray-50);border:1px solid var(--border-subtle);opacity:.7"><span class="t" style="background:var(--gray-200);color:var(--text-muted)">D</span><span style="flex:1;color:var(--text-secondary)">Non retenue</span><span class="mono">muted</span></div>
</div></div></body></html>
