<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(12,14,16,.08)}.mono{font:var(--text-code);color:var(--text-muted)}.lbl{font:var(--text-label)}</style></head>
<body><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<div class="sw" style="align-items:center"><span style="height:40px;padding:0 20px;border-radius:var(--radius-md);background:var(--brand-700);color:#fff;display:flex;align-items:center;font:var(--text-button);box-shadow:var(--shadow-1);transform:none">Lancer</span><span class="mono">Repos</span></div><div class="sw" style="align-items:center"><span style="height:40px;padding:0 20px;border-radius:var(--radius-md);background:var(--brand-600);color:#fff;display:flex;align-items:center;font:var(--text-button);box-shadow:var(--shadow-2);transform:none">Lancer</span><span class="mono">Survol</span></div><div class="sw" style="align-items:center"><span style="height:40px;padding:0 20px;border-radius:var(--radius-md);background:var(--brand-700);color:#fff;display:flex;align-items:center;font:var(--text-button);box-shadow:var(--shadow-inset-press);transform:translateY(1px)">Lancer</span><span class="mono">Pressé</span></div><div class="sw" style="align-items:center"><span style="height:40px;padding:0 20px;border-radius:var(--radius-md);background:var(--brand-700);color:#fff;display:flex;align-items:center;font:var(--text-button);box-shadow:var(--focus-ring);transform:none">Lancer</span><span class="mono">Focus</span></div>
<div class="sw" style="align-items:center"><span style="height:40px;padding:0 20px;border-radius:var(--radius-md);background:var(--gray-100);color:var(--text-muted);border:1px solid var(--border-subtle);display:flex;align-items:center;font:var(--text-button)">Lancer</span><span class="mono">Désactivé</span></div>
</div></body></html>
