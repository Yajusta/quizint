<!-- @dsCard group="Colors" viewport="700x210" name="Surface & text aliases" subtitle="Use the alias, not the raw ramp value" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(12,14,16,.08)}.mono{font:var(--text-code);color:var(--text-muted)}.lbl{font:var(--text-label)}</style></head>
<body><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 28px">
<div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--surface-page);box-shadow:none"></span><span class="lbl" style="width:120px">Fond de page</span><span class="mono">--surface-page</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--surface-card);box-shadow:none"></span><span class="lbl" style="width:120px">Carte</span><span class="mono">--surface-card</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--surface-sunken);box-shadow:none"></span><span class="lbl" style="width:120px">Zone creuse</span><span class="mono">--surface-sunken</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--surface-brand);box-shadow:none"></span><span class="lbl" style="width:120px">Action primaire</span><span class="mono">--surface-brand</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--surface-brand-soft);box-shadow:none"></span><span class="lbl" style="width:120px">Teinte marque</span><span class="mono">--surface-brand-soft</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--surface-inverse);box-shadow:none"></span><span class="lbl" style="width:120px">Inversé</span><span class="mono">--surface-inverse</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--stage-bg);box-shadow:none"></span><span class="lbl" style="width:120px">Stage projeté</span><span class="mono">--stage-bg</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--border-subtle);box-shadow:none"></span><span class="lbl" style="width:120px">Bordure carte</span><span class="mono">--border-subtle</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--border-default);box-shadow:none"></span><span class="lbl" style="width:120px">Bordure champ</span><span class="mono">--border-default</span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:34px;height:26px;border-radius:var(--radius-sm);border:1px solid var(--border-default);background:var(--surface-card);box-shadow:var(--focus-ring)"></span><span class="lbl" style="width:120px">Anneau de focus</span><span class="mono">--focus-ring</span></div>
</div></body></html>
