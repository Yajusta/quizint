<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(12,14,16,.08)}.mono{font:var(--text-code);color:var(--text-muted)}.lbl{font:var(--text-label)}</style></head>
<body><div class="g"><div class="sw"><div class="chip" style="width:52px;background:var(--gray-950)"></div><span class="lbl">950</span><span class="mono">--gray-950</span></div><div class="sw"><div class="chip" style="width:52px;background:var(--gray-900)"></div><span class="lbl">900</span><span class="mono">--gray-900</span></div><div class="sw"><div class="chip" style="width:52px;background:var(--gray-800)"></div><span class="lbl">800</span><span class="mono">--gray-800</span></div><div class="sw"><div class="chip" style="width:52px;background:var(--gray-700)"></div><span class="lbl">700</span><span class="mono">--gray-700</span></div><div class="sw"><div class="chip" style="width:52px;background:var(--gray-600)"></div><span class="lbl">600</span><span class="mono">--gray-600</span></div><div class="sw"><div class="chip" style="width:52px;background:var(--gray-500)"></div><span class="lbl">500</span><span class="mono">--gray-500</span></div><div class="sw"><div class="chip" style="width:52px;background:var(--gray-400)"></div><span class="lbl">400</span><span class="mono">--gray-400</span></div><div class="sw"><div class="chip" style="width:52px;background:var(--gray-300)"></div><span class="lbl">300</span><span class="mono">--gray-300</span></div><div class="sw"><div class="chip" style="width:52px;background:var(--gray-200)"></div><span class="lbl">200</span><span class="mono">--gray-200</span></div><div class="sw"><div class="chip" style="width:52px;background:var(--gray-100)"></div><span class="lbl">100</span><span class="mono">--gray-100</span></div><div class="sw"><div class="chip" style="width:52px;background:var(--gray-50)"></div><span class="lbl">50</span><span class="mono">--gray-50</span></div></div></body></html>
