<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(12,14,16,.08)}.mono{font:var(--text-code);color:var(--text-muted)}.lbl{font:var(--text-label)}</style></head>
<body><div style="display:flex;flex-direction:column;gap:10px">
<span style="font:var(--text-overline);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-muted)">Question 7 / 12</span>
<span style="font:var(--text-label)">Titre du quiz</span>
<span style="font:var(--text-button);color:var(--text-brand)">Lancer la session</span>
