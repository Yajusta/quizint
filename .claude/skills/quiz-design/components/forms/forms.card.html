<!-- @dsCard group="Components" viewport="700x330" name="Forms" subtitle="Field, Input, Textarea, Select, Checkbox, Radio, Switch" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-page);padding:20px;font:var(--text-body)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Field, Input, Textarea, Select, Checkbox, Radio, Switch } = window.QuizDesignSystem_2d5b8b;
function FormsCard(){
  const [ok,setOk]=React.useState(true);const [on,setOn]=React.useState(true);const [m,setM]=React.useState('live');
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
      <div className="col">
        <Field label="Titre du quiz" required><Input defaultValue="Culture générale" /></Field>
        <Field label="Recherche" hint="Filtre la bibliothèque"><Input icon="search" placeholder="Rechercher un quiz" /></Field>
        <Field label="Durée par question"><Select options={[{value:'20',label:'20 secondes'},{value:'30',label:'30 secondes'}]} /></Field>
        <Field label="Code invalide" error="Ce code de session n'existe pas"><Input error defaultValue="000 000" /></Field>
      </div>
      <div className="col">
        <Field label="Explication"><Textarea rows={3} placeholder="Affichée après la réponse" /></Field>
        <Checkbox checked={ok} onChange={setOk} label="Réponses multiples" description="Plusieurs propositions cochables" />
        <Checkbox label="Mélanger les propositions" />
        <Radio name="m" value={m} onChange={setM} direction="row" options={[{value:'live',label:'En direct'},{value:'async',label:'À son rythme'}]} />
        <Switch checked={on} onChange={setOn} label="Classement après chaque question" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<FormsCard/>);
</script></body></html>
