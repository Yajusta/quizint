<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--surface-page);padding:20px;font:var(--text-body)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}</style></head><body><div id="root"></div>
<script type="text/babel">
const { Tabs, Stepper, SideNav, Badge } = window.QuizDesignSystem_2d5b8b;
function NavCard(){
  const [t,setT]=React.useState('q');const [p,setP]=React.useState('lib');
  return (
    <div style={{display:'grid',gridTemplateColumns:'232px 1fr',gap:24,alignItems:'start'}}>
      <SideNav value={p} onChange={setP} style={{borderRadius:'var(--radius-lg)',border:'1px solid var(--border-subtle)',borderRight:'1px solid var(--border-subtle)'}}
        header={<div style={{font:'600 17px/1 var(--font-display)',letterSpacing:'-0.02em',padding:'4px 0 8px'}}>Quiz</div>}
        items={[{value:'lib',label:'Mes quiz',icon:'library',count:8},{value:'ses',label:'Sessions',icon:'history'},{value:'res',label:'Résultats',icon:'bar-chart-3'},{value:'set',label:'Réglages',icon:'settings'}]} />
      <div className="col" style={{gap:28,paddingTop:8}}>
        <Tabs value={t} onChange={setT} tabs={[{value:'q',label:'Questions',count:12},{value:'s',label:'Réglages'},{value:'a',label:'Aperçu',icon:'eye'}]} />
        <Stepper steps={['Informations','Questions','Lancement']} current={1} />
        <div className="row"><Badge tone="brand">Étape 2 sur 3</Badge></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<NavCard/>);
</script></body></html>
