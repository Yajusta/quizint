<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Quiz — Participant</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;background:var(--surface-sunken)}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel">
const { Button } = window.QuizDesignSystem_2d5b8b;
function App(){
  const [step,setStep]=React.useState('join');
  const [name,setName]=React.useState('Camille');
  const [picked,setPicked]=React.useState(null);
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20}}>
      {step==='join' && <JoinScreen onJoin={(n)=>{setName(n);setStep('wait')}} />}
      {step==='wait' && <WaitingScreen name={name} />}
      {step==='question' && <QuestionScreen onAnswer={(l)=>{setPicked(l);setStep('feedback')}} />}
      {step==='feedback' && <FeedbackScreen picked={picked} onNext={()=>setStep('rank')} />}
      {step==='rank' && <RankScreen onRestart={()=>setStep('join')} />}
      {step==='wait' && <Button variant="secondary" size="sm" onClick={()=>setStep('question')}>Le présentateur démarre la question →</Button>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
