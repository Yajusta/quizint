<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Quiz — Présentateur</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%}body{margin:0;overflow:hidden}#root{height:100vh}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="LibraryScreen.jsx"></script>
<script type="text/babel" src="EditorScreen.jsx"></script>
<script type="text/babel" src="StageScreens.jsx"></script>
<script type="text/babel">
const { SideNav, Badge, Button } = window.QuizDesignSystem_2d5b8b;
function App(){
  const [view,setView]=React.useState('library');
  const [nav,setNav]=React.useState('lib');
  const stage = view==='lobby'||view==='question'||view==='reveal'||view==='results';
  if (stage) {
    if (view==='lobby') return <LobbyStage onStart={()=>setView('question')} onQuit={()=>setView('library')} />;
    if (view==='question') return <QuestionStage onReveal={()=>setView('reveal')} />;
    if (view==='reveal') return <QuestionStage revealed onNext={()=>setView('results')} />;
    return <ResultsStage onRestart={()=>setView('library')} />;
  }
  return (
    <div style={{display:'flex',height:'100%',background:'var(--surface-page)'}}>
      <SideNav value={nav} onChange={setNav}
        header={<div style={{display:'flex',flexDirection:'column',gap:2,padding:'2px 0 10px'}}>
          <span style={{font:'700 19px/1 var(--font-display)',letterSpacing:'-0.03em'}}>Quiz</span>
          <span style={{font:'var(--text-body-sm)',color:'var(--text-muted)'}}>Espace présentateur</span></div>}
        items={[{value:'lib',label:'Mes quiz',icon:'library',count:4},{value:'ses',label:'Sessions',icon:'history'},{value:'res',label:'Résultats',icon:'bar-chart-3'},{value:'set',label:'Réglages',icon:'settings'}]}
        footer={<div style={{padding:'var(--space-4)',display:'flex',flexDirection:'column',gap:8}}>
          <Badge tone="brand" icon="user">Marie Duval</Badge></div>} />
      <div style={{flex:1,minWidth:0,overflow:'auto'}}>
        {view==='editor'
          ? <EditorScreen onLaunch={()=>setView('lobby')} onBack={()=>setView('library')} />
          : <LibraryScreen onLaunch={()=>setView('lobby')} onEdit={()=>setView('editor')} />}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
